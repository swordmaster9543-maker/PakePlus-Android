// 下载文件工具函数
function downloadFile(content, filename, mime){
    const blob = new Blob([content], {type: mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
}

function exportJson(){

// 导入JSON配置
function importJson(file){
    const reader = new FileReader();
    reader.onload = function(e){
        try{
            const obj = JSON.parse(e.target.result);
            data = Object.assign(data, obj);
            save();
            fullRender();
            alert("导入成功");
        }catch(err){
            alert("文件解析失败");
        }
    }
    reader.readAsText(file);
}

    document.querySelectorAll(".inp-rowgap").forEach(input=>{
        input.onchange = function(){
            const idx = Number(this.dataset.idx);
            let v = parseInt(this.value);
            data.areas[idx].layout.rowGap = Math.max(0,Math.min(80,isNaN(v)?14:v));
            save();
        }
    });
    document.querySelectorAll(".inp-colgap").forEach(input=>{
        input.onchange = function(){
            const idx = Number(this.dataset.idx);
            let v = parseInt(this.value);
            data.areas[idx].layout.colGap = Math.max(0,Math.min(80,isNaN(v)?14:v));
            save();
        }
    });
    document.querySelectorAll(".inp-center").forEach(input=>{
        input.onchange = function(){
            const idx = Number(this.dataset.idx);
            data.areas[idx].layout.center = this.checked;
            save();
        }
    });
    document.querySelectorAll(".applyLayoutBtn").forEach(btn=>{
        btn.onclick=()=>{ save(); fullRender(); }
    });
    document.querySelectorAll(".addBtnToArea").forEach(btn=>{
        btn.onclick=()=>{
            const i = Number(btn.dataset.idx);
            const ar = data.areas[i];
            const nameEl = document.querySelector(`.inp-name[data-idx="${i}"]`);
            const urlEl = document.querySelector(`.inp-url[data-idx="${i}"]`);
            const name = nameEl.value.trim();
            let url = urlEl.value.trim();
            if(!name||!url){alert("填写名称和网址");return;}
            if (!/^https?:\/\//i.test(url)) url="https://"+url;
            ar.buttons.push({name,url});
            nameEl.value="";urlEl.value="";
            save();fullRender();
        }
    });
    document.querySelectorAll(".delAreaBtn").forEach(btn=>{
        btn.onclick=()=>{
            const i = Number(btn.dataset.idx);
            if(data.areas.length<=1)return;
            data.areas.splice(i,1);
            save();fullRender();
        }
    });
    renderAllColor();
}
function addNewArea(){
    const newId = "area_"+Date.now();
    const newIdx = data.areas.length;
    const ch = CHN_NUM[newIdx] ?? (newIdx+1);
    data.areas.push({
        id:newId,
        name:`区域${ch}`,
        layout:{cols:4,center:true,btnWidth:180,btnHeight:80,rowGap:14,colGap:14},
        buttons:[]
    });
    save();fullRender();
}
function toggleConfig() {
    data.configVisible = !data.configVisible;
    document.getElementById("configPanel").classList.toggle("hidden", !data.configVisible);
    save();
}
function toggleDelButton() {
    data.delBtnVisible = !data.delBtnVisible;
    save();fullRender();
}
function init() {
    load();
    document.getElementById("pageBg").value = data.globalColor.pageBg;
    document.getElementById("btnBg").value = data.globalColor.btnBg;
    document.getElementById("btnHoverBg").value = data.globalColor.btnHoverBg;
    document.getElementById("showAreaName").checked = data.showAreaName;
    document.getElementById("areaNameCenter").checked = data.areaNameCenter;
    renderPageTitle();
    document.getElementById("applyPageTitleBtn").onclick = applyPageTitle;
    document.getElementById("modalCancel").onclick = closeEditModal;
    document.getElementById("modalSave").onclick = saveEditModal;
    document.getElementById("showAreaName").onchange = ()=>{
        data.showAreaName = document.getElementById("showAreaName").checked;
        save();fullRender();
    }
    document.getElementById("areaNameCenter").onchange = ()=>{
        data.areaNameCenter = document.getElementById("areaNameCenter").checked;
        save();fullRender();
    }
    document.getElementById("configPanel").classList.toggle("hidden", !data.configVisible);
    document.getElementById("toggleConfigBtn").addEventListener("click", toggleConfig);
    document.getElementById("toggleDelBtn").addEventListener("click", toggleDelButton);
    document.getElementById("addNewAreaBtn").addEventListener("click", addNewArea);

    //导出导入按钮事件
    document.getElementById("exportJsonBtn").onclick = exportJson;
    document.getElementById("importJsonBtn").onclick = function(){
        document.getElementById("fileImportInput").click();
    };
    document.getElementById("fileImportInput").onchange = function(e){
        if(e.target.files.length>0){
            importJson(e.target.files[0]);
            this.value = '';
        }
    }
    document.getElementById("exportFullHtmlBtn").onclick = exportFullHtml;

    fullRender();
}
init();
</script>


</body></html>
